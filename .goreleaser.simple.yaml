# .goreleaser.simple.yaml builds the embedded server for Linux amd64 and
# publishes its runtime image to the repository owner's GHCR namespace.
# The GitHub Release contains the annotated tag notes and Docker installation
# instructions; version, amd64, and latest tags point to the same image.
version: 2

project_name: tokenrouter

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: tokenrouter
    dir: backend
    main: ./cmd/server
    binary: tokenrouter
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

# Binary archives are excluded from uploads by release.skip_upload below.
archives: []

# Container-only releases do not publish downloadable archive checksums.
checksum:
  disable: true

changelog:
  disable: true

# The three tags share one Linux amd64 image build.
dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenrouter:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenrouter:{{ .Version }}"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenrouter:latest"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

# A single architecture is published directly through its image tags.
docker_manifests: []

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  name_template: "TokenRouter {{.Version}} (Simple)"
  # Release assets are delivered through GHCR for this container-only mode.
  skip_upload: true
  header: |
    > Simple release: Linux amd64 container image.

    {{ .Env.TAG_MESSAGE }}

  footer: |
    ---

    ## Installation

    Docker (Linux amd64):
    ```bash
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenrouter:{{ .Version }}
    ```

    ## Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
